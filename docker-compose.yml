# Local PostgreSQL 16 with pgvector.   docker compose up -d
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: kbeauty
    ports:
      - "5432:5432"   # change the left number (e.g. "5433:5432") if 5432 is already used
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
