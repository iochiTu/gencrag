<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product Recommender</title>
<style>
  :root { color-scheme: light; --ink:#1f2328; --quiet:#667085; --line:#e4e7ec; --bg:#fafafa; --card:#fff; --soft:#f6f6f4;
          --accent:#c2416b; --accent-bg:#fdf2f6; --on-accent:#fff; --good:#008300; }
  @media (prefers-color-scheme: dark) {
    :root { color-scheme: dark; --ink:#f2f2f0; --quiet:#b5b4ad; --line:#33332f; --bg:#121211; --card:#1a1a19; --soft:#22221f;
            --accent:#e86d96; --accent-bg:#3a1f29; --on-accent:#1a0d12; --good:#3fb43f; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--ink); background:var(--bg); }
  main { max-width: 1280px; margin: 0 auto; padding: 24px 16px; display:grid; grid-template-columns: 340px 1fr; gap:24px; align-items:start; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  h1 { font-size: 20px; margin: 0 0 4px; } .sub { color:var(--quiet); font-size:13px; margin-bottom:16px; }
  form, .result { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  label.h { display:block; font-weight:600; font-size:13px; margin:14px 0 6px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chips label { border:1px solid var(--line); border-radius:999px; padding:4px 10px; font-size:13px; cursor:pointer; user-select:none; }
  .chips input { display:none; }
  .chips label:has(input:checked) { border-color:var(--accent); background:var(--accent-bg); color:var(--accent); font-weight:600; }
  select, input[type=number], textarea { width:100%; padding:8px; border:1px solid var(--line); border-radius:8px; font:inherit; background:var(--card); color:var(--ink); }
  .row { display:flex; gap:8px; } textarea { min-height:70px; }
  button.go { margin-top:16px; width:100%; padding:10px; border:0; border-radius:8px; background:var(--accent); color:var(--on-accent); font-weight:600; font-size:15px; cursor:pointer; }
  button.go:disabled { opacity:.6; }
  .stephead { display:flex; align-items:baseline; gap:8px; margin:18px 0 8px; }
  .stephead:first-child { margin-top:0; }
  .stephead b { font-size:15px; } .stephead span { color:var(--quiet); font-size:13px; }
  .opts { display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:10px; }
  .card { border:1px solid var(--line); border-radius:10px; padding:12px 14px; display:flex; flex-direction:column; background:var(--card); }
  .card.first { border-color:var(--accent); }
  .badge { align-self:flex-start; font-size:11.5px; padding:1px 8px; border-radius:999px; background:var(--soft); color:var(--quiet); margin-bottom:6px; }
  .card.first .badge { background:var(--accent-bg); color:var(--accent); font-weight:600; }
  .top { display:flex; justify-content:space-between; gap:8px; }
  .name { font-weight:600; } .price { font-weight:600; white-space:nowrap; }
  .small { font-size:12px; color:var(--quiet); }
  .reason { margin-top:8px; font-size:14px; }
  ul.ben { margin:8px 0 0; padding-left:18px; font-size:13px; } ul.ben li { margin:2px 0; }
  .card .actions { margin-top:auto; padding-top:10px; }
  .card .actions button, .fb button { padding:4px 10px; font-size:12px; background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:6px; cursor:pointer; }
  .sold { color:var(--good); font-size:12px; font-weight:600; }
  .meta { color:var(--quiet); font-size:12px; margin-top:12px; }
  .tip { margin-top:16px; padding:10px 12px; background:var(--soft); border-radius:8px; font-size:14px; }
  .fb button { margin:8px 6px 0 0; }
  .empty { color:var(--quiet); }
</style>
</head>
<body>
<main>
<section>
  <h1>Customer product recommender</h1>
  <div class="sub">For store and CS staff</div>
  <form id="f">
    <label class="h">Skin type</label>
    <select name="skin_type">
      <option value="">Not specified</option><option value="dry">Dry</option><option value="oily">Oily</option>
      <option value="combination">Combination</option><option value="normal">Normal</option>
    </select>
    <div class="chips" style="margin-top:8px"><label><input type="checkbox" name="sensitive">Sensitive</label></div>

    <label class="h">Concerns</label>
    <div class="chips" id="concerns"></div>

    <label class="h">Must avoid</label>
    <div class="chips" id="avoid"></div>

    <div class="row">
      <div style="flex:1"><label class="h">Age</label><input type="number" name="age" min="10" max="100" placeholder="Optional"></div>
      <div style="flex:2"><label class="h">Budget per item</label>
        <div class="row"><input type="number" name="budget_min" placeholder="Min" step="1" min="0"><input type="number" name="budget_max" placeholder="Max" step="1" min="0"></div></div>
    </div>

    <label class="h">Note (free text)</label>
    <textarea name="text" placeholder="e.g. Dry, flaky skin with redness, early 40s, pregnant, under $30"></textarea>

    <div class="row">
      <div style="flex:1"><label class="h">Routine steps</label>
        <select name="top_n"><option>1</option><option>2</option><option>3</option><option selected>4</option><option>5</option></select></div>
      <div style="flex:1"><label class="h">Choices per step</label>
        <select name="options"><option value="">Default</option><option>1</option><option>2</option><option>3</option><option>4</option></select></div>
    </div>
    <div class="chips" style="margin-top:10px"><label><input type="checkbox" name="debug">Show scores (managers)</label></div>
    <button class="go" id="go" type="submit">Recommend</button>
  </form>
</section>
<section class="result" id="out"><div class="empty">Enter the customer's details to get recommendations. Each routine step shows several products to choose from, best match first.</div></section>
</main>
<script>
const CONCERNS = {acne:"Breakouts",dryness:"Dryness",redness:"Redness",pigmentation:"Dark spots",wrinkles:"Fine lines",pores:"Pores",dullness:"Dullness",oiliness:"Excess oil"};
const AVOID = {pregnancy:"Pregnant / nursing",fragrance:"Fragrance",retinoid:"Retinoids",aha:"AHA",bha:"BHA",alcohol:"Alcohol",essential_oil:"Essential oils"};
const CAT = {cleanser:"Cleanser",toner:"Toner",essence:"Essence",serum:"Serum / ampoule",cream:"Moisturizer",sunscreen:"Sunscreen",mask:"Mask",other:"Other"};
const chips = (id, obj) => document.getElementById(id).innerHTML =
  Object.entries(obj).map(([k,v]) => `<label><input type="checkbox" value="${k}">${v}</label>`).join("");
chips("concerns", CONCERNS); chips("avoid", AVOID);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money = (n, cur) => { try { return new Intl.NumberFormat("en-US", {style:"currency", currency:cur}).format(n); } catch { return `${n} ${cur}`; } };
const checked = id => [...document.querySelectorAll(`#${id} input:checked`)].map(i => i.value);
let LOG_ID = null;

function optionCard(c, cur) {
  const first = c.option === 1;
  return `<div class="card ${first ? "first" : ""}">
    <span class="badge">${first ? "Best match" : "Option " + c.option}</span>
    <div class="top"><div class="name">${esc(c.name)}</div><div class="price">${money(c.price, cur)}</div></div>
    <div class="small">${esc(c.sku)}${c.brand ? " · " + esc(c.brand) : ""}${c.ages ? " · ages " + esc(c.ages) : ""}</div>
    <div class="reason">${esc(c.reason)}</div>
    ${(c.key_benefits || []).length ? `<ul class="ben">${c.key_benefits.map(b => `<li>${esc(b)}</li>`).join("")}</ul>` : ""}
    ${(c.key_ingredients || []).length ? `<div class="small" style="margin-top:8px">Key ingredients: ${esc(c.key_ingredients.join(", "))}</div>` : ""}
    ${c.debug ? `<div class="small" style="margin-top:6px">score ${c.debug.score} · fit ${c.debug.skin_fit} · margin ${c.debug.margin_pct == null ? "n/a" : (c.debug.margin_pct*100).toFixed(0) + "%"} · priority ${c.debug.priority_norm}${c.debug.campaign_boost ? " · campaign" : ""}</div>` : ""}
    <div class="actions"><button type="button" data-sold="${esc(c.sku)}">Customer bought this</button></div>
  </div>`;
}

document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const fd = new FormData(e.target), out = document.getElementById("out"), btn = document.getElementById("go");
  const profile = {
    skin_type: fd.get("skin_type") || null, sensitive: fd.get("sensitive") === "on",
    concerns: checked("concerns"), avoid: checked("avoid"), age: fd.get("age") ? Number(fd.get("age")) : null,
    budget_min: Number(fd.get("budget_min") || 0), budget_max: fd.get("budget_max") ? Number(fd.get("budget_max")) : null,
  };
  btn.disabled = true; btn.textContent = "Thinking... (local models take 10-60 s)"; out.innerHTML = "";
  try {
    const r = await fetch("/recommend", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({profile, text: fd.get("text") || null, top_n: Number(fd.get("top_n")),
                            options: fd.get("options") ? Number(fd.get("options")) : null, debug: fd.get("debug") === "on"})});
    const d = await r.json();
    if (!r.ok) throw new Error(typeof d.detail === "string" ? d.detail : r.statusText);
    if (d.status !== "ok") { out.innerHTML = `<div class="empty">${esc(d.message)}</div>`; return; }
    LOG_ID = d.log_id;
    out.innerHTML = d.steps.map((s, i) => `
      <div class="stephead"><b>Step ${i + 1} · ${esc(CAT[s.category] || s.category)}</b>
        <span>${s.options.length > 1 ? s.options.length + " choices" : "1 choice"}</span></div>
      <div class="opts">${s.options.map(c => optionCard(c, d.currency)).join("")}</div>`).join("") +
      (d.routine_tip ? `<div class="tip"><b>Routine tip:</b> ${esc(d.routine_tip)}</div>` : "") +
      `<div class="meta">Best-match routine total ${money(d.total, d.currency)} · ${esc(d.model)} · ${(d.elapsed_ms/1000).toFixed(1)} s</div>
       <div class="fb">Was this helpful?
         <button type="button" data-f="accepted">Good suggestions</button>
         <button type="button" data-f="swapped">Customer chose something else</button>
         <button type="button" data-f="rejected">Not suitable</button></div>`;
  } catch (err) { out.innerHTML = `<div class="empty">Error: ${esc(err.message)}</div>`; }
  finally { btn.disabled = false; btn.textContent = "Recommend"; }
});

async function sendFeedback(feedback, sku) {
  await fetch("/feedback", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({log_id: LOG_ID, feedback, sku: sku || null})});
}
document.getElementById("out").addEventListener("click", async e => {
  const sold = e.target.closest("button[data-sold]");
  if (sold) { await sendFeedback("sold", sold.dataset.sold); sold.parentElement.innerHTML = `<span class="sold">Sold, thanks</span>`; return; }
  const b = e.target.closest("button[data-f]"); if (!b) return;
  await sendFeedback(b.dataset.f); b.parentElement.innerHTML = `<span class="meta">Feedback saved</span>`;
});
</script>
</body>
</html>
