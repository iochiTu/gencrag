<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product Recommender</title>
<style>
  :root { --ink:#1f2328; --quiet:#667085; --line:#e4e7ec; --bg:#fafafa; --card:#fff; --accent:#c2416b; --accent-bg:#fdf2f6; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--ink); background:var(--bg); }
  main { max-width: 1040px; margin: 0 auto; padding: 24px 16px; display:grid; grid-template-columns: 360px 1fr; gap:24px; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  h1 { font-size: 20px; margin: 0 0 4px; } .sub { color:var(--quiet); font-size:13px; margin-bottom:16px; }
  form, .result { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  label.h { display:block; font-weight:600; font-size:13px; margin:14px 0 6px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chips label { border:1px solid var(--line); border-radius:999px; padding:4px 10px; font-size:13px; cursor:pointer; user-select:none; }
  .chips input { display:none; }
  .chips label:has(input:checked) { border-color:var(--accent); background:var(--accent-bg); color:var(--accent); font-weight:600; }
  select, input[type=number], textarea { width:100%; padding:8px; border:1px solid var(--line); border-radius:8px; font:inherit; }
  .row { display:flex; gap:8px; } textarea { min-height:70px; }
  button.go { margin-top:16px; width:100%; padding:10px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-weight:600; font-size:15px; cursor:pointer; }
  button.go:disabled { opacity:.6; }
  .card { border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:10px; }
  .card .top { display:flex; justify-content:space-between; gap:8px; }
  .step { font-size:12px; color:var(--quiet); } .name { font-weight:600; } .price { font-weight:600; white-space:nowrap; }
  .reason { margin-top:6px; font-size:14px; } .meta { color:var(--quiet); font-size:12px; margin-top:8px; }
  .fb button { margin:8px 6px 0 0; padding:4px 10px; font-size:12px; background:#fff; color:var(--ink); border:1px solid var(--line); border-radius:6px; cursor:pointer; }
  .empty { color:var(--quiet); }
</style>
</head>
<body>
<main>
<section>
  <h1>Customer product recommender</h1>
  <div class="sub">For store and CS staff</div>
  <form id="f">
    <label class="h">Skin type</label>
    <select name="skin_type">
      <option value="">Not specified</option><option value="dry">Dry</option><option value="oily">Oily</option>
      <option value="combination">Combination</option><option value="normal">Normal</option>
    </select>
    <div class="chips" style="margin-top:8px"><label><input type="checkbox" name="sensitive">Sensitive</label></div>

    <label class="h">Concerns</label>
    <div class="chips" id="concerns"></div>

    <label class="h">Must avoid</label>
    <div class="chips" id="avoid"></div>

    <label class="h">Budget per item</label>
    <div class="row"><input type="number" name="budget_min" placeholder="Min" step="1" min="0"><input type="number" name="budget_max" placeholder="Max" step="1" min="0"></div>

    <label class="h">Note (free text)</label>
    <textarea name="text" placeholder="e.g. Dry, flaky skin with redness, pregnant, under $30"></textarea>

    <label class="h">Number of products</label>
    <select name="top_n"><option>3</option><option selected>4</option><option>5</option></select>
    <div class="chips" style="margin-top:8px"><label><input type="checkbox" name="debug">Show scores (managers)</label></div>
    <button class="go" id="go" type="submit">Recommend</button>
  </form>
</section>
<section class="result" id="out"><div class="empty">Enter the customer's details to get a recommendation.</div></section>
</main>
<script>
const CONCERNS = {acne:"Breakouts",dryness:"Dryness",redness:"Redness",pigmentation:"Dark spots",wrinkles:"Fine lines",pores:"Pores",dullness:"Dullness",oiliness:"Excess oil"};
const AVOID = {pregnancy:"Pregnant / nursing",fragrance:"Fragrance",retinoid:"Retinoids",aha:"AHA",bha:"BHA",alcohol:"Alcohol",essential_oil:"Essential oils"};
const chips = (id, obj) => document.getElementById(id).innerHTML =
  Object.entries(obj).map(([k,v]) => `<label><input type="checkbox" value="${k}">${v}</label>`).join("");
chips("concerns", CONCERNS); chips("avoid", AVOID);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money = (n, cur) => { try { return new Intl.NumberFormat("en-US", {style:"currency", currency:cur}).format(n); } catch { return `${n} ${cur}`; } };
const checked = id => [...document.querySelectorAll(`#${id} input:checked`)].map(i => i.value);
const FB = {accepted:"Good pick", swapped:"Swapped a product", sold:"Sold", rejected:"Not suitable"};

document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const fd = new FormData(e.target), out = document.getElementById("out"), btn = document.getElementById("go");
  const profile = {
    skin_type: fd.get("skin_type") || null, sensitive: fd.get("sensitive") === "on",
    concerns: checked("concerns"), avoid: checked("avoid"),
    budget_min: Number(fd.get("budget_min") || 0), budget_max: fd.get("budget_max") ? Number(fd.get("budget_max")) : null,
  };
  btn.disabled = true; btn.textContent = "Thinking... (local models take 10-60 s)"; out.innerHTML = "";
  try {
    const r = await fetch("/recommend", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({profile, text: fd.get("text") || null, top_n: Number(fd.get("top_n")), debug: fd.get("debug") === "on"})});
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || r.statusText);
    if (d.status !== "ok") { out.innerHTML = `<div class="empty">${esc(d.message)}</div>`; return; }
    out.innerHTML = d.recommendations.map(c => `
      <div class="card"><div class="top">
        <div><div class="step">Step ${c.routine_step} · ${esc(c.category)}</div>
        <div class="name">${esc(c.name)}</div><div class="step">${esc(c.sku)} · ${esc((c.key_ingredients || []).join(", "))}</div></div>
        <div class="price">${money(c.price, d.currency)}</div></div>
        <div class="reason">${esc(c.reason)}</div>
        ${c.debug ? `<div class="meta">score ${c.debug.score} · fit ${c.debug.skin_fit} · similarity ${c.debug.similarity} · margin ${(c.debug.margin_pct*100).toFixed(0)}% · priority ${c.debug.priority_norm} · boost ${c.debug.campaign_boost}</div>` : ""}
      </div>`).join("") +
      (d.routine_tip ? `<div class="reason"><b>Routine tip:</b> ${esc(d.routine_tip)}</div>` : "") +
      `<div class="meta">Total ${money(d.total, d.currency)} · ${esc(d.model)} · ${d.elapsed_ms} ms</div>
       <div class="fb" data-id="${d.log_id}">${Object.entries(FB).map(([k,v]) => `<button type="button" data-f="${k}">${v}</button>`).join("")}</div>`;
  } catch (err) { out.innerHTML = `<div class="empty">Error: ${esc(err.message)}</div>`; }
  finally { btn.disabled = false; btn.textContent = "Recommend"; }
});
document.getElementById("out").addEventListener("click", async e => {
  const b = e.target.closest("button[data-f]"); if (!b) return;
  const id = Number(b.parentElement.dataset.id);
  await fetch("/feedback", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({log_id:id, feedback:b.dataset.f})});
  b.parentElement.innerHTML = `<span class="meta">Feedback saved</span>`;
});
</script>
</body>
</html>
