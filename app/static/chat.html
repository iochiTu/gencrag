<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F0F2D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GenC Assist">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<link rel="icon" href="/static/icons/favicon.png">
<title>Gen C Beauty Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cabin:wght@400;500;600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
  /* Gen C Beauty design language (gencbeauty.com): white pages, navy bars, bold uppercase buttons,
     pill-shaped grey search field, thin grey card borders, green prices, pink-red accents. */
  :root {
    color-scheme: light;
    --navy: #0F0F2D; --navy-2: #212152; --blue: #1F439E; --pink: #E40E47; --pink-bg: #FDECEF;
    --green: #128234; --ink: #000000; --text: #2B2B2B; --muted: #6B6B6B; --line: #DDDDDD;
    --field: #EFEFEF; --soft: #F5F5F7; --white: #FFFFFF;
    --body: "Cabin", Arial, Helvetica, sans-serif; --btn: "Nunito", Arial, Helvetica, sans-serif;
    --side: 288px; --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--white); color: var(--text); font-family: var(--body); font-size: 15px; }
  button { font: inherit; cursor: pointer; }
  .hidden { display: none !important; }

  /* ---------- buttons (site style: Nunito, uppercase, 700, radius 5px) ---------- */
  .btn { font-family: var(--btn); font-weight: 800; text-transform: uppercase; letter-spacing: .02em; font-size: 13px;
         border-radius: 5px; border: 1.5px solid var(--navy-2); background: var(--white); color: var(--navy-2);
         padding: 10px 16px; min-height: 44px; }
  .btn.primary { background: var(--navy); border-color: var(--navy); color: var(--white); }
  .btn.small { font-size: 11.5px; padding: 6px 10px; min-height: 34px; }
  .btn:disabled { opacity: .5; }

  /* ---------- login ---------- */
  #login { min-height: 100%; display: flex; flex-direction: column; }
  #login .strip { background: var(--navy); color: var(--white); font-size: 12.5px; padding: calc(8px + var(--safe-t)) 16px 8px; text-align: center; }
  #login .box { width: min(400px, calc(100% - 32px)); margin: auto; padding: 32px 0; }
  .logo { display: block; height: 44px; max-width: 200px; object-fit: contain; }
  .wordmark { font-family: var(--body); font-weight: 700; font-size: 22px; letter-spacing: .06em; color: var(--ink); }
  .wordmark small { display: block; font-size: 8px; letter-spacing: .3em; font-weight: 600; margin-top: -2px; }
  #login h1 { font-size: 22px; margin: 28px 0 4px; color: var(--ink); }
  #login p { color: var(--muted); margin: 0 0 20px; }
  label.f { display: block; font-weight: 600; font-size: 13px; margin: 14px 0 6px; color: var(--ink); }
  input.f { width: 100%; font: inherit; font-size: 16px; padding: 12px 16px; border: 1px solid transparent; background: var(--field);
            border-radius: 999px; outline: none; }
  input.f:focus { border-color: var(--navy-2); background: var(--white); }
  .err { color: var(--pink); font-size: 13px; min-height: 20px; margin-top: 10px; }

  /* ---------- app shell ---------- */
  #app { height: 100vh; height: 100dvh; display: grid; grid-template-columns: var(--side) 1fr; }
  aside { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; background: var(--white); }
  aside .head { padding: calc(14px + var(--safe-t)) 16px 12px; border-bottom: 1px solid var(--line); }
  aside .new { margin: 14px 16px 6px; }
  aside .label { font-family: var(--btn); font-weight: 800; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 12px 16px 6px; }
  #convs { flex: 1; overflow-y: auto; padding: 0 8px; }
  .conv { display: flex; align-items: center; gap: 6px; padding: 10px 10px; border-radius: 6px; color: var(--text); cursor: pointer; }
  .conv:hover, .conv.on { background: var(--soft); }
  .conv.on { color: var(--ink); font-weight: 600; }
  .conv span { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
  .conv button { border: 0; background: none; color: var(--muted); width: 28px; height: 28px; border-radius: 4px; font-size: 16px; }
  .conv button:hover { background: var(--line); color: var(--ink); }
  aside .foot { border-top: 1px solid var(--line); padding: 12px 16px calc(12px + var(--safe-b)); display: flex; align-items: center; gap: 8px; }
  aside .foot .who { flex: 1; min-width: 0; font-size: 13.5px; }
  aside .foot .who b { display: block; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  aside .foot .who span { color: var(--muted); font-size: 12px; }
  .iconbtn { border: 0; background: none; width: 44px; height: 44px; border-radius: 8px; display: grid; place-items: center; color: var(--navy); }
  .iconbtn:hover { background: var(--soft); }
  .iconbtn svg { width: 22px; height: 22px; }

  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .strip { background: var(--navy); color: var(--white); font-size: 12.5px; }
  main > .strip { padding: 7px 20px; display: flex; justify-content: space-between; }
  main > .strip span:last-child { opacity: .8; }
  .topbar { display: none; }
  #scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  #msgs { max-width: 900px; margin: 0 auto; padding: 20px 20px 8px; }

  /* ---------- welcome ---------- */
  .welcome { text-align: center; padding: 6vh 0 12px; }
  .welcome h2 { font-size: 24px; color: var(--ink); margin: 18px 0 6px; }
  .welcome p { color: var(--muted); margin: 0 0 22px; }
  .examples { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; text-align: left; }
  .examples button { border: 1px solid var(--line); background: var(--white); border-radius: 6px; padding: 14px; text-align: left; color: var(--text); min-height: 64px; }
  .examples button:hover { border-color: var(--navy-2); }
  .examples b { display: block; font-family: var(--btn); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--blue); margin-bottom: 4px; }

  /* ---------- messages ---------- */
  .msg { display: flex; gap: 10px; margin: 14px 0; }
  .msg.user { justify-content: flex-end; }
  .bubble { max-width: min(80%, 560px); background: var(--navy-2); color: var(--white); padding: 10px 14px; border-radius: 18px 18px 4px 18px; white-space: pre-wrap; word-wrap: break-word; line-height: 1.4; }
  .avatar { flex: 0 0 32px; height: 32px; border-radius: 50%; background: var(--navy); color: var(--white); display: grid; place-items: center; font-family: var(--btn); font-weight: 800; font-size: 12px; }
  .bot { flex: 1; min-width: 0; line-height: 1.5; color: var(--text); }
  .bot .text p { margin: 4px 0 8px; }
  .bot .text strong { color: var(--ink); }
  .bot.err .text { color: var(--pink); }
  .pchips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px; }
  .pchips span { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--soft); color: var(--navy-2); border: 1px solid var(--line); }
  .step { margin: 14px 0 6px; }
  .stephead { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
  .stephead b { font-family: var(--btn); font-weight: 800; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--navy); }
  .stephead span { font-size: 12px; color: var(--muted); }
  .opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .card { border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; background: var(--white); display: flex; flex-direction: column; min-width: 0; }
  .card.first { border-color: var(--navy-2); box-shadow: inset 0 3px 0 var(--navy-2); }
  .badge { align-self: flex-start; font-family: var(--btn); font-weight: 800; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 3px; background: var(--soft); color: var(--muted); margin-bottom: 8px; }
  .card.first .badge { background: var(--navy); color: var(--white); }
  .card .row { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .card .name { font-weight: 600; color: var(--ink); line-height: 1.3; }
  .card .price { font-weight: 700; color: var(--green); white-space: nowrap; }
  .card .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .card .why { font-size: 14px; margin-top: 8px; }
  .card ul { margin: 6px 0 0; padding-left: 18px; font-size: 13px; } .card li { margin: 2px 0; }
  .card .ings { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .card .note { font-size: 12px; color: var(--pink); background: var(--pink-bg); border-radius: 4px; padding: 4px 8px; margin-top: 8px; }
  .card .flags { font-size: 12px; margin-top: 6px; color: var(--navy-2); }
  .card .act { margin-top: auto; padding-top: 10px; }
  .card .act .btn { width: 100%; }
  .sold { font-family: var(--btn); font-weight: 800; font-size: 12px; text-transform: uppercase; color: var(--green); text-align: center; padding: 8px 0; }
  .total { font-size: 13px; color: var(--muted); margin-top: 10px; }
  .fb { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; font-size: 13px; color: var(--muted); }
  .typing span { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); margin-right: 4px; animation: blink 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }

  /* ---------- composer (site search-bar style) ---------- */
  .dock { border-top: 1px solid var(--line); background: var(--white); padding: 8px 0 calc(10px + var(--safe-b)); }
  .dock-in { max-width: 900px; margin: 0 auto; padding: 0 20px; }
  #chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 8px; scrollbar-width: none; }
  #chips::-webkit-scrollbar { display: none; }
  #chips button { flex: 0 0 auto; border: 1px solid var(--line); background: var(--white); color: var(--navy-2); border-radius: 999px; padding: 7px 14px; font-size: 13.5px; min-height: 36px; }
  #chips button:hover { border-color: var(--navy-2); }
  form.compose { display: flex; align-items: flex-end; gap: 8px; background: var(--field); border-radius: 24px; padding: 6px 6px 6px 18px; border: 1px solid transparent; }
  form.compose:focus-within { border-color: var(--navy-2); background: var(--white); }
  form.compose textarea { flex: 1; border: 0; background: transparent; resize: none; font: inherit; font-size: 16px; line-height: 1.4; padding: 8px 0; max-height: 140px; outline: none; color: var(--ink); }
  form.compose button { flex: 0 0 40px; height: 40px; border-radius: 50%; border: 0; background: var(--navy); color: var(--white); display: grid; place-items: center; }
  form.compose button:disabled { background: #B9B9C3; }
  .hint { text-align: center; font-size: 11.5px; color: var(--muted); margin-top: 6px; }

  /* ---------- dialog ---------- */
  dialog { border: 0; border-radius: 8px; padding: 24px; width: min(420px, calc(100% - 32px)); }
  dialog::backdrop { background: rgba(15, 15, 45, .5); }
  dialog h3 { margin: 0 0 6px; color: var(--ink); }
  dialog p { margin: 0 0 8px; color: var(--muted); font-size: 14px; }
  dialog .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }

  /* ---------- phones and portrait tablets ---------- */
  @media (max-width: 899px) {
    #app { grid-template-columns: 1fr; }
    aside { position: fixed; inset: 0 auto 0 0; width: min(86vw, 320px); z-index: 30; transform: translateX(-100%); transition: transform .2s ease; box-shadow: 0 0 30px rgba(0,0,0,.2); }
    #app.menu aside { transform: none; }
    #scrim { position: fixed; inset: 0; background: rgba(15, 15, 45, .45); z-index: 20; display: none; }
    #app.menu #scrim { display: block; }
    main > .strip { display: none; }
    .topbar { display: flex; align-items: center; gap: 4px; padding: calc(4px + var(--safe-t)) 6px 4px; border-bottom: 1px solid var(--line); background: var(--white); }
    .topbar .mid { flex: 1; display: flex; justify-content: center; }
    .topbar .logo { height: 32px; }
    #msgs { padding: 14px 14px 6px; }
    .dock-in { padding: 0 12px; }
    .bubble { max-width: 86%; }
    .avatar { display: none; }
    /* product choices swipe sideways on phones */
    .opts { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding-inline: 14px; gap: 10px; margin: 0 -14px; padding: 0 14px 6px; scrollbar-width: none; }
    .opts::-webkit-scrollbar { display: none; }
    .opts .card { flex: 0 0 min(82vw, 300px); scroll-snap-align: start; }
    .swipe { font-size: 11.5px; color: var(--muted); }
    .welcome { padding-top: 3vh; }
    .welcome > .brand-slot { display: none !important; }      /* logo is already in the top bar */
    .welcome h2 { font-size: 20px; }
  }
  @media (min-width: 900px) { .swipe { display: none; } #scrim { display: none; } }
</style>
</head>
<body>

<!-- ============ Sign in ============ -->
<section id="login" class="hidden">
  <div class="strip">Gen C Beauty · Staff product assistant</div>
  <div class="box">
    <div class="brand-slot"></div>
    <h1>Sign in</h1>
    <p>Use the staff account your manager gave you.</p>
    <form id="loginForm" autocomplete="on">
      <label class="f" for="u">Username</label>
      <input class="f" id="u" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" required>
      <label class="f" for="p">Password</label>
      <input class="f" id="p" name="password" type="password" autocomplete="current-password" required>
      <div class="err" id="loginErr"></div>
      <button class="btn primary" style="width:100%;margin-top:6px">Sign in</button>
    </form>
  </div>
</section>

<!-- ============ App ============ -->
<div id="app" class="hidden">
  <aside>
    <div class="head brand-slot"></div>
    <button class="btn primary new" id="newBtn">+ New customer</button>
    <div class="label">Recent chats</div>
    <div id="convs"></div>
    <div class="foot">
      <div class="who"><b id="whoName"></b><span id="whoUser"></span></div>
      <button class="iconbtn" id="pwdBtn" title="Change password" aria-label="Change password">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></button>
      <button class="iconbtn" id="outBtn" title="Sign out" aria-label="Sign out">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 17l-5-5 5-5M5 12h11"/></svg></button>
    </div>
  </aside>
  <div id="scrim"></div>
  <main>
    <div class="strip"><span>Gen C Beauty · Staff product assistant</span><span id="stripUser"></span></div>
    <div class="topbar">
      <button class="iconbtn" id="menuBtn" aria-label="Open menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="mid brand-slot"></div>
      <button class="iconbtn" id="newBtn2" aria-label="New customer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <div id="scroll"><div id="msgs"></div></div>
    <div class="dock"><div class="dock-in">
      <div id="chips"></div>
      <form class="compose" id="compose">
        <textarea id="input" rows="1" placeholder="Describe the customer or ask about a product" enterkeyhint="send"></textarea>
        <button id="send" aria-label="Send" disabled><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </form>
      <div class="hint">Suggestions come from our product data. Check labels for allergies.</div>
    </div></div>
  </main>
</div>

<dialog id="pwdDlg">
  <form id="pwdForm">
    <h3>Change password</h3>
    <p id="pwdWhy">At least 8 characters.</p>
    <label class="f" for="pc">Current password</label><input class="f" id="pc" type="password" autocomplete="current-password" required>
    <label class="f" for="pn">New password</label><input class="f" id="pn" type="password" autocomplete="new-password" minlength="8" required>
    <div class="err" id="pwdErr"></div>
    <div class="actions"><button type="button" class="btn" id="pwdCancel">Cancel</button><button class="btn primary">Save</button></div>
  </form>
</dialog>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\*(.+?)\*/g, "<em>$1</em>")
                      .split(/\n{2,}/).map(p => `<p>${p.replace(/\n/g, "<br>")}</p>`).join("");
const CAT = {cleanser:"Cleanser", toner:"Toner", essence:"Essence", serum:"Serum / ampoule", cream:"Moisturizer", sunscreen:"Sunscreen", mask:"Mask", other:"Other"};
let ME = null, CUR = "USD", CONV = null, BUSY = false;
const money = n => { try { return new Intl.NumberFormat("en-US", {style:"currency", currency:CUR}).format(n); } catch { return n; } };

async function api(path, opts = {}) {
  const r = await fetch(path, {headers: {"Content-Type": "application/json"}, credentials: "same-origin", ...opts});
  const d = await r.json().catch(() => ({}));
  if (r.status === 401 && path !== "/api/login") { showLogin(); throw new Error("Please sign in."); }
  if (!r.ok) throw new Error(typeof d.detail === "string" ? d.detail : "Something went wrong. Please try again.");
  return d;
}

/* ---------- brand ---------- */
function paintBrand(brand) {
  const wordmark = `<div class="wordmark">GEN'C BEAUTY<small>GENUINE · CLASSY</small></div>`;
  document.querySelectorAll(".brand-slot").forEach(el => {
    el.innerHTML = brand?.logo_url ? `<img class="logo" src="${esc(brand.logo_url)}" alt="${esc(brand.name || "Gen C Beauty")}">` : wordmark;
    const img = el.querySelector("img"); if (img) img.onerror = () => { el.innerHTML = wordmark; };
  });
}

/* ---------- sign in ---------- */
const store = {get: k => { try { return localStorage.getItem(k) || ""; } catch { return ""; } },
               set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }};
function showLogin(msg) { $("#app").classList.add("hidden"); $("#login").classList.remove("hidden"); $("#loginErr").textContent = msg || ""; paintBrand({logo_url: store.get("logo")}); }
async function boot() {
  try {
    const d = await api("/api/me"); ME = d.user; CUR = d.currency;
    store.set("logo", d.brand.logo_url || "");
    paintBrand(d.brand);
    $("#login").classList.add("hidden"); $("#app").classList.remove("hidden");
    $("#whoName").textContent = ME.display_name; $("#whoUser").textContent = "@" + ME.username; $("#stripUser").textContent = ME.display_name;
    loadConvs(); newChat();
    if (ME.must_change_password) openPwd(true);
  } catch (e) { if (e.message !== "Please sign in.") showLogin(e.message); }
}
$("#loginForm").onsubmit = async e => {
  e.preventDefault(); $("#loginErr").textContent = "";
  try { await api("/api/login", {method: "POST", body: JSON.stringify({username: $("#u").value, password: $("#p").value})}); $("#p").value = ""; boot(); }
  catch (err) { $("#loginErr").textContent = err.message; }
};
$("#outBtn").onclick = async () => { await api("/api/logout", {method: "POST"}).catch(() => {}); showLogin(); };

/* ---------- password ---------- */
function openPwd(forced) {
  $("#pwdWhy").textContent = forced ? "Please choose your own password before you start (at least 8 characters)." : "At least 8 characters.";
  $("#pwdCancel").classList.toggle("hidden", !!forced); $("#pwdErr").textContent = ""; $("#pc").value = ""; $("#pn").value = "";
  $("#pwdDlg").showModal();
}
$("#pwdBtn").onclick = () => openPwd(false);
$("#pwdCancel").onclick = () => $("#pwdDlg").close();
$("#pwdDlg").addEventListener("cancel", e => { if (ME?.must_change_password) e.preventDefault(); });
$("#pwdForm").onsubmit = async e => {
  e.preventDefault();
  try { const d = await api("/api/password", {method: "POST", body: JSON.stringify({current: $("#pc").value, new: $("#pn").value})}); ME = d.user; $("#pwdDlg").close(); }
  catch (err) { $("#pwdErr").textContent = err.message; }
};

/* ---------- history ---------- */
async function loadConvs() {
  const d = await api("/api/conversations");
  $("#convs").innerHTML = d.conversations.length ? d.conversations.map(c =>
    `<div class="conv ${c.id === CONV ? "on" : ""}" data-id="${c.id}"><span>${esc(c.title)}</span><button data-del="${c.id}" aria-label="Delete chat" title="Delete">×</button></div>`).join("")
    : `<div class="conv" style="cursor:default;color:var(--muted)"><span>No chats yet</span></div>`;
}
$("#convs").onclick = async e => {
  const del = e.target.closest("[data-del]");
  if (del) { e.stopPropagation(); await api(`/api/conversations/${del.dataset.del}`, {method: "DELETE"}); if (+del.dataset.del === CONV) newChat(); loadConvs(); return; }
  const c = e.target.closest(".conv[data-id]"); if (!c) return;
  const d = await api(`/api/conversations/${c.dataset.id}`);
  CONV = d.conversation.id; $("#msgs").innerHTML = ""; d.messages.forEach(render);
  const last = [...d.messages].reverse().find(m => m.role === "assistant");
  chips(last?.payload?.suggestions || []); closeMenu(); loadConvs(); scrollDown();
};
const closeMenu = () => $("#app").classList.remove("menu");
$("#menuBtn").onclick = () => $("#app").classList.add("menu");
$("#scrim").onclick = closeMenu;

/* ---------- new chat / welcome ---------- */
const EXAMPLES = [
  ["Routine", "Combination skin, breakouts and redness, 24 years old, under $30"],
  ["Mature skin", "Dry, mature skin in her 40s, fine lines and dullness"],
  ["Pregnancy", "Pregnant customer with sensitive skin who wants a gentle routine"],
  ["Product question", "What's the difference between the Cica Repair Ampoule and the Niacinamide 10% Spot Serum?"],
];
function newChat() {
  CONV = null; closeMenu();
  $("#msgs").innerHTML = `<div class="welcome"><div class="brand-slot" style="display:flex;justify-content:center"></div>
    <h2>Hi ${esc(ME.display_name.split(" ")[0])}, who are we helping today?</h2>
    <p>Describe the customer's skin, concerns, age, budget and anything to avoid. You'll get products to offer, best match first.</p>
    <div class="examples">${EXAMPLES.map(([t, q]) => `<button data-q="${esc(q)}"><b>${esc(t)}</b>${esc(q)}</button>`).join("")}</div></div>`;
  paintBrand({logo_url: store.get("logo")});
  chips(["Dry skin", "Oily skin", "Combination skin", "Sensitive skin", "Breakouts", "Fine lines"]);
  document.querySelectorAll(".conv").forEach(c => c.classList.remove("on"));
  $("#input").focus({preventScroll: true});
}
$("#newBtn").onclick = newChat; $("#newBtn2").onclick = newChat;
$("#msgs").addEventListener("click", e => { const q = e.target.closest("[data-q]"); if (q) send(q.dataset.q); });

/* ---------- rendering ---------- */
function card(c, logId, first) {
  const notes = (c.notes || []).map(n => `<div class="note">${esc(n)}</div>`).join("");
  const benefits = (c.key_benefits || []).length ? `<ul>${c.key_benefits.map(b => `<li>${esc(b)}</li>`).join("")}</ul>` : "";
  const ings = Array.isArray(c.key_ingredients) && c.key_ingredients.length ? `<div class="ings">Key ingredients: ${esc(c.key_ingredients.join(", "))}</div>` : "";
  const flags = (c.flags || []).length ? `<div class="flags">Contains: ${esc(c.flags.map(f => f.replace("_", " ")).join(", "))}</div>` : "";
  const meta = [c.sku, c.brand, c.ages].filter(Boolean).map(esc).join(" · ");
  const badge = c.option ? (first ? "Best match" : `Choice ${c.option}`) : esc(CAT[c.category] || c.category);
  return `<div class="card ${first ? "first" : ""}"><span class="badge">${badge}</span>
    <div class="row"><div class="name">${esc(c.name)}</div><div class="price">${money(c.price)}</div></div>
    <div class="meta">${meta}</div>${c.reason ? `<div class="why">${esc(c.reason)}</div>` : ""}${benefits}${ings}${flags}${notes}
    ${logId ? `<div class="act"><button class="btn small" data-sold="${esc(c.sku)}" data-log="${logId}">Customer bought this</button></div>` : ""}</div>`;
}
function render(m) {
  const wrap = document.createElement("div");
  if (m.role === "user") { wrap.className = "msg user"; wrap.innerHTML = `<div class="bubble">${esc(m.content)}</div>`; }
  else {
    const p = m.payload || {};
    wrap.className = "msg";
    let body = `<div class="text">${md(m.content)}</div>`;
    if (p.profile_chips?.length) body += `<div class="pchips">${p.profile_chips.map(c => `<span>${esc(c)}</span>`).join("")}</div>`;
    if (p.type === "recommendation") {
      body += p.steps.map((s, i) => `<div class="step"><div class="stephead"><b>Step ${i + 1} · ${esc(CAT[s.category] || s.category)}</b>
          <span>${s.options.length > 1 ? s.options.length + " choices" : "1 choice"}${s.options.length > 1 ? '<span class="swipe"> · swipe for more</span>' : ""}</span></div>
        <div class="opts">${s.options.map((o, j) => card(o, m.log_id, j === 0)).join("")}</div></div>`).join("");
      body += `<div class="total">Best-match routine: ${money(p.total)}</div>
        <div class="fb" data-log="${m.log_id}">Were these suggestions helpful?
          <button class="btn small" data-f="accepted">Yes</button><button class="btn small" data-f="rejected">Not suitable</button></div>`;
    }
    if (p.type === "products") body += `<div class="opts" style="margin-top:8px">${p.products.map(c => card(c, null, false)).join("")}</div>`;
    wrap.innerHTML = `<div class="avatar">G'C</div><div class="bot ${p.error ? "err" : ""}">${body}</div>`;
  }
  $("#msgs").appendChild(wrap);
}
function chips(list) { $("#chips").innerHTML = (list || []).map(c => `<button type="button" data-chip="${esc(c)}">${esc(c)}</button>`).join(""); }
$("#chips").onclick = e => { const b = e.target.closest("[data-chip]"); if (b) send(b.dataset.chip); };
const scrollDown = () => requestAnimationFrame(() => { const s = $("#scroll"); s.scrollTop = s.scrollHeight; });

/* ---------- feedback ---------- */
$("#msgs").addEventListener("click", async e => {
  const sold = e.target.closest("[data-sold]");
  if (sold) {
    try { await api("/api/feedback", {method: "POST", body: JSON.stringify({log_id: +sold.dataset.log, feedback: "sold", sku: sold.dataset.sold})});
          sold.parentElement.innerHTML = `<div class="sold">✓ Sold</div>`; } catch (err) { sold.textContent = "Try again"; }
    return;
  }
  const f = e.target.closest(".fb [data-f]");
  if (f) { const box = f.closest(".fb");
    try { await api("/api/feedback", {method: "POST", body: JSON.stringify({log_id: +box.dataset.log, feedback: f.dataset.f})}); box.innerHTML = "Thanks for the feedback."; } catch {} }
});

/* ---------- sending ---------- */
const input = $("#input");
function autosize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 140) + "px"; $("#send").disabled = BUSY || !input.value.trim(); }
input.addEventListener("input", autosize);
input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("#compose").requestSubmit(); } });
$("#compose").onsubmit = e => { e.preventDefault(); send(input.value); };

async function send(text) {
  text = (text || "").trim(); if (!text || BUSY) return;
  BUSY = true; input.value = ""; autosize(); chips([]);
  if (!CONV) $("#msgs").innerHTML = "";
  render({role: "user", content: text});
  const typing = document.createElement("div"); typing.className = "msg"; typing.innerHTML = `<div class="avatar">G'C</div><div class="bot"><div class="typing"><span></span><span></span><span></span></div></div>`;
  $("#msgs").appendChild(typing); scrollDown();
  try {
    const d = await api("/api/chat", {method: "POST", body: JSON.stringify({message: text, conversation_id: CONV})});
    typing.remove();
    const isNew = !CONV; CONV = d.conversation.id;
    render(d.messages[1]); chips(d.messages[1].payload?.suggestions || []);
    if (isNew) loadConvs();
  } catch (err) {
    typing.remove();
    render({role: "assistant", content: err.message, payload: {type: "text", error: true}});
  } finally { BUSY = false; autosize(); scrollDown(); }
}

if (matchMedia("(max-width: 520px)").matches) input.placeholder = "Describe the customer…";
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
boot();
</script>
</body>
</html>
